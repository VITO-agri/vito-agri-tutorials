[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.build]
exclude = [
  "/dist",
  "/scripts",
  "/bin",
  "/tests",
]

[tool.hatch.build.targets.wheel]
packages = ["src/vito_agri_tutorials"]

[tool.hatch.build.targets.wheel.force-include]
"notebooks/drought/1_ndvi_anomalies.ipynb" = "vito_agri_tutorials/_notebooks/ndvi/1_ndvi_anomalies.ipynb"

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/notebooks/drought/1_ndvi_anomalies.ipynb",
  "/pyproject.toml",
  "/README.md",
  "/LICENSE",
]

[tool.hatch.version]
path = "src/vito_agri_tutorials/_version.py"
pattern = "^__version__ = ['\"](?P<version>[^'\"]+)['\"]$"

[project]
name = "vito_agri_tutorials"
authors = [
    { name="Jeroen Degerickx" },
]
description = "VITO Agriculture Tutorials"
readme = "README.md"
requires-python = ">=3.11"
# dynamic = ["version"]
version = "0.1.0"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = []

[project.urls]
"Homepage" = "https://github.com/VITO-agri/vito-agri-tutorials"
"Bug Tracker" = ""

[project.optional-dependencies]
ndvi = [
  "openeo>=0.39.1,<1",
  "ipyleaflet>=0.19.2,<1",
  "ipywidgets>=8.1,<9",
  "ipython>=8",
  "geopandas>=1.0.1,<2",
  "shapely>=2,<3",
  "pyproj>=3.6,<4",
  "matplotlib>=3.10.1,<4",
  "geojson>=3.2.0,<4",
  "numpy>=1.26,<3",
  "pandas>=2.2,<3",
  "scipy>=1.15.2,<2",
  "xarray>=2025.1.1",
  "loguru>=0.7,<1",
  "requests>=2.31,<3",
]
dev = [
  "pytest>=7.4.0",
  "pytest-depends",  
  "matplotlib>=3.3.0"
]

[tool.pytest.ini_options]
testpaths = [
  "tests",
]
addopts = [
  "--import-mode=prepend",
]

[tool.isort]
profile = "black"

[tool.ruff]
# line-length = 88

[tool.ruff.lint]
select = ["E", "F"]
ignore = [
  "E501",  # Ignore "line-too-long" issues, let black handle that.
]