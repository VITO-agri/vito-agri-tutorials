[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.build]
exclude = [
  "/dist",
  "/scripts",
  "/bin",
  "/tests",
]

[tool.hatch.build.targets.wheel]
packages = ["src/vito_agri_tutorials"]

[tool.hatch.build.targets.wheel.force-include]
"notebooks/drought/1_ndvi_anomalies.ipynb" = "vito_agri_tutorials/_notebooks/drought/1_ndvi_anomalies.ipynb"
"notebooks/drought/2_asis_data_access.ipynb" = "vito_agri_tutorials/_notebooks/drought/2_asis_data_access.ipynb"
"notebooks/drought/3_wapor_data_access.ipynb" = "vito_agri_tutorials/_notebooks/drought/3_wapor_data_access.ipynb"
"notebooks/drought/4_vici.ipynb" = "vito_agri_tutorials/_notebooks/drought/4_vici.ipynb"
"notebooks/drought/ASIS_README.md" = "vito_agri_tutorials/_notebooks/drought/ASIS_README.md"
"notebooks/parcel/1_Preprocessing.ipynb" = "vito_agri_tutorials/_notebooks/parcel/1_Preprocessing.ipynb"
"notebooks/parcel/2_Field_delineation_and_phenology.ipynb" = "vito_agri_tutorials/_notebooks/parcel/2_Field_delineation_and_phenology.ipynb"
"notebooks/parcel/3_Croptype_mapping.ipynb" = "vito_agri_tutorials/_notebooks/parcel/3_Croptype_mapping.ipynb"
"notebooks/openeo/Sentinel-2-retrieval.ipynb" = "vito_agri_tutorials/_notebooks/openeo/Sentinel-2-retrieval.ipynb"
"notebooks/timeseries_decomposition/A_visualisation.ipynb" = "vito_agri_tutorials/_notebooks/timeseries_decomposition/A_visualisation.ipynb"
"notebooks/timeseries_decomposition/B_preprocessing.ipynb" = "vito_agri_tutorials/_notebooks/timeseries_decomposition/B_preprocessing.ipynb"
"notebooks/timeseries_decomposition/C_decomposition.ipynb" = "vito_agri_tutorials/_notebooks/timeseries_decomposition/C_decomposition.ipynb"
"notebooks/timeseries_decomposition/D_change.ipynb" = "vito_agri_tutorials/_notebooks/timeseries_decomposition/D_change.ipynb"
"notebooks/timeseries_decomposition/data/A_visualisation" = "vito_agri_tutorials/_notebooks/timeseries_decomposition/data/A_visualisation"
"notebooks/timeseries_decomposition/data/B_preprocessing" = "vito_agri_tutorials/_notebooks/timeseries_decomposition/data/B_preprocessing"
"notebooks/timeseries_decomposition/data/D_change_detection/ts_fire.csv" = "vito_agri_tutorials/_notebooks/timeseries_decomposition/data/D_change_detection/ts_fire.csv"
"notebooks/timeseries_decomposition/data/D_change_detection/ts_fire2.csv" = "vito_agri_tutorials/_notebooks/timeseries_decomposition/data/D_change_detection/ts_fire2.csv"
"notebooks/timeseries_decomposition/auxiliary" = "vito_agri_tutorials/_notebooks/timeseries_decomposition/auxiliary"

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/notebooks/drought/1_ndvi_anomalies.ipynb",
  "/notebooks/drought/2_asis_data_access.ipynb",
  "/notebooks/drought/3_wapor_data_access.ipynb",
  "/notebooks/drought/4_vici.ipynb",
  "/notebooks/drought/ASIS_README.md",
  "/notebooks/parcel/*.ipynb",
  "/notebooks/openeo/*.ipynb",
  "/notebooks/timeseries_decomposition/*.ipynb",
  "/notebooks/timeseries_decomposition/data/A_visualisation/*.csv",
  "/notebooks/timeseries_decomposition/data/B_preprocessing/*.csv",
  "/notebooks/timeseries_decomposition/data/D_change_detection/*.csv",
  "/notebooks/timeseries_decomposition/auxiliary",
  "/pyproject.toml",
  "/README.md",
  "/LICENSE",
]

[tool.hatch.version]
path = "src/vito_agri_tutorials/_version.py"
pattern = "^__version__ = ['\"](?P<version>[^'\"]+)['\"]$"

[project]
name = "vito_agri_tutorials"
authors = [
    { name="Jeroen Degerickx" },
]
description = "VITO Agriculture Tutorials"
readme = "README.md"
requires-python = ">=3.11"
# dynamic = ["version"]
version = "0.1.0"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = []

[project.urls]
"Homepage" = "https://github.com/VITO-agri/vito-agri-tutorials"
"Bug Tracker" = ""

